name: Release gem

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Audit release dependencies
        run: bundle exec bundle-audit check --update

      - name: Release gate
        run: bundle exec rake ci

      - uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1
