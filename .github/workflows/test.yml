name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ruby/setup-ruby@ec02537da5712d66d4d50a0f33b7eb52773b5ed1 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Test
        run: COVERAGE=true bundle exec rake test
      - name: Check Ruby syntax
        run: find lib test examples -name "*.rb" -exec ruby -c {} \;
      - name: Build gem
        if: matrix.ruby == '4.0'
        run: gem build olyx-guardrails.gemspec

  quality:
    name: RubyCritic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ruby/setup-ruby@ec02537da5712d66d4d50a0f33b7eb52773b5ed1 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Generate coverage data
        run: COVERAGE=true bundle exec rake test
      - name: Enforce maintainability score
        run: bundle exec rubycritic
